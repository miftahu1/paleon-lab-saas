site: paleon-lab-saas.dev
sector: saas
description: Early-stage B2B SaaS test site with intentional development-environment, source-metadata, configuration-file, API-specification, version-disclosure, DNS-indicator, and header weaknesses.
reset: ./reset.sh

detections:
  - id: exposed-git-directory
    category: exposed_files
    target: app.paleon-lab-saas.dev
    expect:
      paths:
        - /.git/config
        - /.git/HEAD
      status: 200
    severity: high
    claim: observed

  - id: exposed-env-file
    category: exposed_files
    target: app.paleon-lab-saas.dev
    expect:
      path: /.env
      status: 200
      contains:
        - DATABASE_URL
        - API_KEY
        - JWT_SECRET
        - AWS_ACCESS_KEY_ID
      synthetic_only: true
    severity: high
    claim: observed

  - id: exposed-openapi-spec
    category: exposed_files
    target: app.paleon-lab-saas.dev
    expect:
      path: /openapi.json
      status: 200
      content_type: application/json
    severity: medium
    claim: observed

  - id: dev-subdomain-discovery
    category: subdomain_discovery
    target: dev.paleon-lab-saas.dev
    expect:
      dns_resolves: true
      http_status: 200
    severity: low
    claim: observed

  - id: outdated-express-version
    category: outdated_software
    target: dev.paleon-lab-saas.dev
    expect:
      header: X-Powered-By
      value: Express/4.17.1
    severity: medium
    claim: detected

  - id: subdomain-takeover-indicator
    category: subdomain_takeover_indicator
    target: legacy.paleon-lab-saas.dev
    expect:
      record_type: CNAME
      target: legacy-placeholder.example.invalid
      claimable: false
    severity: medium
    claim: observed

  - id: missing-permissions-policy
    category: security_headers
    target: app.paleon-lab-saas.dev
    expect:
      header_missing: Permissions-Policy
    severity: low
    claim: observed

must_not_flag:
  - category: confirmed_cve_exploitation
    reason: Outdated versions are disclosed only; no active exploitation is present.

  - category: confirmed_subdomain_takeover
    target: legacy.paleon-lab-saas.dev
    reason: The CNAME points to a safe .invalid placeholder and is not claimable.

  - category: real_credentials
    target: app.paleon-lab-saas.dev
    reason: Exposed configuration values are synthetic placeholders using example.invalid data and other fake values.

  - category: sql_injection
    target: app.paleon-lab-saas.dev
    reason: No database or dynamic query functionality exists.

  - category: xss
    target: app.paleon-lab-saas.dev
    reason: The supplied site is static and does not process user input.

  - category: authentication_bypass
    target: app.paleon-lab-saas.dev
    reason: No authentication system exists.

  - category: ssrf
    target: paleon-lab-saas.dev
    reason: No proxy functionality or server-side URL fetching exists.

  - category: database_exposure
    target: paleon-lab-saas.dev
    reason: No database server exists.

  - category: unnecessary_open_ports
    target: paleon-lab-saas.dev
    reason: The documented public posture is 80/443, with 22 restricted to the admin CIDR.

  - category: weak_tls
    target: paleon-lab-saas.dev
    reason: The site is documented with valid Let's Encrypt TLS and modern configuration.

  - category: weak_email_security
    target: paleon-lab-saas.dev
    reason: The documented posture is SPF -all, DMARC p=reject, DNSSEC enabled, and CAA restricted to Let's Encrypt.

  - category: missing_dnssec
    target: paleon-lab-saas.dev
    reason: DNSSEC is documented as enabled.

  - category: missing_caa
    target: paleon-lab-saas.dev
    reason: CAA is documented as configured for Let's Encrypt.

hosts:
  - hostname: paleon-lab-saas.dev
    purpose: main_marketing_site
    expected_intentional_findings: []

  - hostname: app.paleon-lab-saas.dev
    purpose: application_host
    expected_intentional_findings:
      - exposed-git-directory
      - exposed-env-file
      - exposed-openapi-spec
      - missing-permissions-policy

  - hostname: dev.paleon-lab-saas.dev
    purpose: development_environment
    expected_intentional_findings:
      - outdated-express-version
      - dev-subdomain-discovery

  - hostname: legacy.paleon-lab-saas.dev
    purpose: dns_only_indicator
    expected_intentional_findings:
      - subdomain-takeover-indicator

security_posture:
  tls: modern_and_valid

  network:
    public_ports:
      - 80
      - 443
    restricted_port: 22

  email:
    spf: 'v=spf1 -all'
    dmarc: 'v=DMARC1; p=reject;'
    dnssec: enabled
    caa: letsencrypt_only

  headers:
    app_missing:
      - Permissions-Policy

validation_commands:
  dns:
    - 'dig paleon-lab-saas.dev +short'
    - 'dig app.paleon-lab-saas.dev +short'
    - 'dig dev.paleon-lab-saas.dev +short'
    - 'dig legacy.paleon-lab-saas.dev CNAME +short'
    - 'dig paleon-lab-saas.dev DNSKEY +short'
    - 'dig paleon-lab-saas.dev CAA +short'

  exposures:
    - 'curl https://app.paleon-lab-saas.dev/.env'
    - 'curl https://app.paleon-lab-saas.dev/.git/config'
    - 'curl https://app.paleon-lab-saas.dev/.git/HEAD'
    - 'curl https://app.paleon-lab-saas.dev/openapi.json'