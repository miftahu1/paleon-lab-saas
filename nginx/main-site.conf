server {
    listen 80;
    listen [::]:80;
    server_name paleon-lab-saas.dev;

    root /var/www/main;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paleon-lab-saas.dev;

    ssl_certificate /etc/letsencrypt/live/paleon-lab-saas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paleon-lab-saas.dev/privkey.pem;

    root /var/www/main;
    index index.html;

    # Include security headers
    include /etc/nginx/security-headers.conf;

    # Main site includes Permissions-Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
