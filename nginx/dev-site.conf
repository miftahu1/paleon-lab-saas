# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dev.paleon-lab-saas.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.paleon-lab-saas.dev;

    ssl_certificate /etc/letsencrypt/live/paleon-lab-saas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paleon-lab-saas.dev/privkey.pem;

    # Include security headers
    include /etc/nginx/security-headers.conf;

    # Dev site has standard headers including Permissions-Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
