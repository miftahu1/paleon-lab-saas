# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.paleon-lab-saas.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.paleon-lab-saas.dev;

    ssl_certificate /etc/letsencrypt/live/paleon-lab-saas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paleon-lab-saas.dev/privkey.pem;

    root /var/www/app;
    index index.html;

    # Include security headers
    include /etc/nginx/security-headers.conf;

    # INTENTIONALLY omit Permissions-Policy on app host

    location / {
        try_files $uri $uri/ =404;
    }

    # DO NOT block dotfiles on app host - intentional exposure
    # Allow .env and .git to be publicly accessible
    location ~ /\.(env|git) {
        allow all;
    }

    # Explicitly serve .git directory files
    location ~ ^/\.git/(config|HEAD) {
        allow all;
    }
}
